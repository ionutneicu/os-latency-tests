<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 228" role="img" aria-label="SPSC streaming throughput">
<style>
  .bg{fill:#fcfcfb} .ax{fill:#52514e;font:12px system-ui,sans-serif} .title{fill:#0b0b0b;font:600 15px system-ui,sans-serif}
  .grid{stroke:#e4e3df} .zone-a{fill:#f3f2ef} .zone-b{fill:#fcfcfb} .marker{stroke:#8a8984}
  .zlabel{fill:#8a8984;font:600 12px system-ui,sans-serif} .hit{fill:transparent}
  .s1{stroke:#2a78d6} .s2{stroke:#eb6834} .s3{stroke:#1baf7a} .s4{stroke:#6250d6} .s5{stroke:#e87ba4}
  .f1{fill:#2a78d6} .f2{fill:#eb6834} .f3{fill:#1baf7a} .f4{fill:#6250d6} .f5{fill:#e87ba4}
</style><rect class="bg" width="1000" height="228"/>
<text class="title" x="170" y="18">SPSC streaming throughput</text><g transform="translate(0,24)">
<text class="ax" x="160" y="25.0" text-anchor="end">mutex_condvar</text>
<rect class="f1" x="170" y="10" width="73.4" height="22" rx="4"/>
<text class="ax" x="251.4" y="25.0">4.36 M items/s (229 ns/item)  (6.8x slower)</text>
<text class="ax" x="160" y="57.0" text-anchor="end">mutex_poll</text>
<rect class="f1" x="170" y="42" width="91.3" height="22" rx="4"/>
<text class="ax" x="269.3" y="57.0">5.42 M items/s (185 ns/item)  (5.5x slower)</text>
<text class="ax" x="160" y="89.0" text-anchor="end">spinlock</text>
<rect class="f1" x="170" y="74" width="41.2" height="22" rx="4"/>
<text class="ax" x="219.2" y="89.0">2.44 M items/s (409 ns/item)  (12.1x slower)</text>
<text class="ax" x="160" y="121.0" text-anchor="end">lockfree</text>
<rect class="f1" x="170" y="106" width="274.6" height="22" rx="4"/>
<text class="ax" x="452.6" y="121.0">16.3 M items/s (61.3 ns/item)  (1.8x slower)</text>
<text class="ax" x="160" y="153.0" text-anchor="end">lockfree_cached</text>
<rect class="f1" x="170" y="138" width="500.0" height="22" rx="4"/>
<text class="ax" x="678.0" y="153.0">29.7 M items/s (33.7 ns/item)  (fastest)</text>
<text class="ax" x="170" y="196">million items per second (p50 run)</text>
</g>
</svg>